<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinguinos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }
    #objective {
      text-align: center;
      padding: 20px;
      font-size: 24px;
    }
    #controls-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      opacity: 1;
      transition: opacity 2s;
    }
    #completion {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    #completion h1 {
      font-size: 56px;
      margin: 0;
    }
    #completion p {
      font-size: 24px;
      opacity: 0.8;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="objective"></div>
    <div id="controls-hint">WASD to move, Space to jump</div>
    <div id="completion">
      <h1>Level Complete!</h1>
      <p>The penguin found its way through Boulders Beach</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
