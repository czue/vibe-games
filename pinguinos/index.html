<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinguinos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }
    #objective {
      text-align: center;
      padding: 20px;
      font-size: 24px;
    }
    #controls-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      opacity: 1;
      transition: opacity 2s;
    }
    .overlay-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    .overlay-screen h1 {
      font-size: 56px;
      margin: 0;
    }
    .overlay-screen p {
      font-size: 24px;
      opacity: 0.8;
      margin: 0;
    }
    #flash-message {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      opacity: 0;
      transition: opacity 0.5s;
    }
    #save-load-buttons {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    #save-load-buttons button {
      background: rgba(0,0,0,0.5);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      font-family: 'Segoe UI', sans-serif;
    }
    #save-load-buttons button:hover {
      background: rgba(0,0,0,0.7);
    }
    #fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      opacity: 0;
      transition: opacity 1s;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="objective"></div>
    <div id="flash-message"></div>
    <div id="save-load-buttons">
      <button onmouseup="this.blur(); document.dispatchEvent(new Event('quicksave'))">Save (F5)</button>
      <button onmouseup="this.blur(); document.dispatchEvent(new Event('quickload'))">Load (F9)</button>
    </div>
    <div id="controls-hint">WASD to move, Space to jump</div>
    <div id="completion" class="overlay-screen">
      <h1>Level Complete!</h1>
      <p>The penguin found its way through Boulders Beach</p>
    </div>
    <div id="wake-up" class="overlay-screen" style="background: rgba(0,0,0,0.9);">
      <h1>...</h1>
      <p>You black out from the earthquake.</p>
      <p>When you come to, another penguin is standing over you.</p>
      <button id="wake-up-continue" onmouseup="this.blur(); document.dispatchEvent(new Event('wake-up-continue'))" style="margin-top: 20px; padding: 10px 30px; font-size: 18px; cursor: pointer; background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px;">Continue...</button>
    </div>
    <div id="fade-overlay"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
